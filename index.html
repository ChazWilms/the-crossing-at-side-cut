<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Crossing at Side Cut</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Courier New", monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      color: #c9b48a;
      text-align: center;
      cursor: pointer;
      user-select: none;
      z-index: 10;
    }
    #overlay h1 {
      font-size: 28px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #overlay p { font-size: 14px; opacity: 0.7; }
    #overlay.hidden { display: none; }
    #hud {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 5;
      pointer-events: none;
    }
    #stamina {
      width: 260px;
      height: 12px;
      border: 1px solid rgba(201, 180, 138, 0.5);
      background: rgba(0, 0, 0, 0.4);
    }
    #stamina-fill {
      width: 100%;
      height: 100%;
      background: #c9b48a;
      transform-origin: left;
    }
    #fade {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      z-index: 8;
    }
    #changelog {
      position: absolute;
      right: 18px;
      bottom: 14px;
      max-width: min(340px, 32vw);
      max-height: 46vh;
      overflow-y: auto;
      text-align: left;
      font-size: 11px;
      line-height: 1.5;
      color: #c9b48a;
      opacity: 0.85;
      padding-right: 6px;
    }
    #changelog h4 {
      margin: 0 0 4px;
      letter-spacing: 3px;
      font-size: 11px;
      border-bottom: 1px solid rgba(201, 180, 138, 0.4);
      padding-bottom: 3px;
    }
    #changelog .ver {
      margin-top: 6px;
      font-weight: bold;
      color: #e4cf9c;
    }
    #changelog ul {
      margin: 2px 0 0;
      padding-left: 16px;
    }
    #changelog::-webkit-scrollbar { width: 4px; }
    #changelog::-webkit-scrollbar-thumb { background: rgba(201, 180, 138, 0.35); }
    #objective {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 5;
      color: #e4cf9c;
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
    #message {
      position: absolute;
      top: 18%;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 6;
      color: #e8d8ae;
      font-size: 17px;
      letter-spacing: 2px;
      text-shadow: 0 2px 6px #000;
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
    }
    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(8, 2, 2, 0.85) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }
    #bigtext {
      position: absolute;
      top: 42%;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 9;
      font-size: 42px;
      letter-spacing: 10px;
      text-shadow: 0 3px 14px #000;
      opacity: 0;
      transition: opacity 0.8s;
      pointer-events: none;
    }
    #vol {
      position: absolute;
      left: 18px;
      bottom: 14px;
      font-size: 13px;
      color: #c9b48a;
      user-select: none;
    }
    #vol button {
      background: none;
      border: 1px solid rgba(201, 180, 138, 0.5);
      color: #c9b48a;
      font-family: inherit;
      font-size: 14px;
      width: 26px;
      height: 24px;
      cursor: pointer;
    }
    #vol button:hover { background: rgba(201, 180, 138, 0.2); }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>The Crossing at Side Cut</h1>
    <p>Click to begin &mdash; WASD to move, SHIFT to sprint, SPACE to jump,<br/>C to crouch, Q to glance back, F for fullscreen</p>
    <div id="changelog"></div>
    <div id="vol">VOLUME <button id="vol-down">&minus;</button> <span id="vol-val">80%</span> <button id="vol-up">+</button></div>
  </div>
  <div id="vignette"></div>
  <div id="bigtext"></div>
  <div id="hud">
    <div id="stamina"><div id="stamina-fill"></div></div>
  </div>
  <div id="objective"></div>
  <div id="message"></div>
  <div id="fade"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
